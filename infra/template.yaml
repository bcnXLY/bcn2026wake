AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  BCN 2026 Wake — serverless backend. A DynamoDB participant roster and Lambda
  handlers for ID-based login and the role-based contact directory. Designed to
  sit comfortably inside the AWS free tier for a 1-week, 400-500 user event.

Parameters:
  TwilioAccountSid:
    Type: String
    Default: ''
    Description: Twilio Account SID (ACxxxx). Leave empty to disable SMS 2FA.
  TwilioAuthToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: Twilio Auth Token.
  TwilioVerifyServiceSid:
    Type: String
    Default: ''
    Description: Twilio Verify Service SID (VAxxxx).
  DefaultCountryCode:
    Type: String
    Default: '34'
    Description: Country code prepended to roster numbers stored without one.
  OneSignalAppId:
    Type: String
    Default: ''
    Description: OneSignal app ID. Leave empty to disable global-board push.
  OneSignalRestApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: OneSignal REST API key. Leave empty to disable global-board push.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Architectures: [arm64]

Resources:
  ParticipantsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Participants
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: team_id
          AttributeType: S
        - AttributeName: room_id
          AttributeType: S
        - AttributeName: role
          AttributeType: N
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byTeam
          KeySchema:
            - AttributeName: team_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: byRoom
          KeySchema:
            - AttributeName: room_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: byRole
          KeySchema:
            - AttributeName: role
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  TeamMessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TeamMessages
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: team_id
          AttributeType: S
        - AttributeName: message_id
          AttributeType: S
      KeySchema:
        - AttributeName: team_id
          KeyType: HASH
        - AttributeName: message_id
          KeyType: RANGE

  # ---- "The Finite ONE" (field games) ------------------------------------
  # One item: status, world health, the private pace, every team's score.
  # A single GetItem serves every client's whole view.
  GameStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: GameState
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: game_id
          AttributeType: S
      KeySchema:
        - AttributeName: game_id
          KeyType: HASH

  # `award_id` is client-generated, which is what makes a game master's
  # offline queue safe to replay.
  GameAwardsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: GameAwards
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: award_id
          AttributeType: S
        - AttributeName: game_id
          AttributeType: S
        - AttributeName: received_at_ms
          AttributeType: N
      KeySchema:
        - AttributeName: award_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byGame
          KeySchema:
            - AttributeName: game_id
              KeyType: HASH
            - AttributeName: received_at_ms
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # FIFO so a retried send cannot be counted twice. TickFn drains it itself:
  # no event source mapping, because draining and subtracting belong together.
  WorldPointsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: FiniteOneWorldPoints.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 60
      MessageRetentionPeriod: 86400

  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'POST,GET,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  LoginFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: login.lambda_handler
      CodeUri: lambda/
      Environment:
        Variables:
          ATTENDEES_TABLE: !Ref ParticipantsTable
          TWILIO_ACCOUNT_SID: !Ref TwilioAccountSid
          TWILIO_AUTH_TOKEN: !Ref TwilioAuthToken
          TWILIO_VERIFY_SERVICE_SID: !Ref TwilioVerifyServiceSid
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt ParticipantsTable.Arn
                - !Sub '${ParticipantsTable.Arn}/index/*'
      Events:
        Login:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /login
            Method: get

  ContactsFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: contacts.lambda_handler
      CodeUri: lambda/
      Environment:
        Variables:
          ATTENDEES_TABLE: !Ref ParticipantsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:BatchGetItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt ParticipantsTable.Arn
                - !Sub '${ParticipantsTable.Arn}/index/*'
      Events:
        Contacts:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /contacts
            Method: get

  UpdateProfileFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: update_profile.lambda_handler
      CodeUri: lambda/
      Environment:
        Variables:
          ATTENDEES_TABLE: !Ref ParticipantsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt ParticipantsTable.Arn
      Events:
        UpdateProfile:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /profile
            Method: put
        GetProfileStatus:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /profile
            Method: get

  MessagesFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: messages.lambda_handler
      CodeUri: lambda/
      Environment:
        Variables:
          ATTENDEES_TABLE: !Ref ParticipantsTable
          MESSAGES_TABLE: !Ref TeamMessagesTable
          # A post to the global board fans out as web push; unset = no push.
          ONESIGNAL_APP_ID: !Ref OneSignalAppId
          ONESIGNAL_REST_API_KEY: !Ref OneSignalRestApiKey
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - !GetAtt ParticipantsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource:
                - !GetAtt TeamMessagesTable.Arn
      Events:
        ListMessages:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /messages
            Method: get
        PostMessage:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /messages
            Method: post
        DeleteMessage:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /messages
            Method: delete

  GameFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: game.lambda_handler
      CodeUri: lambda/
      Environment:
        Variables:
          ATTENDEES_TABLE: !Ref ParticipantsTable
          GAME_STATE_TABLE: !Ref GameStateTable
          GAME_AWARDS_TABLE: !Ref GameAwardsTable
          WORLD_POINTS_QUEUE_URL: !Ref WorldPointsQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt ParticipantsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt GameStateTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Query
              Resource:
                - !GetAtt GameAwardsTable.Arn
                - !Sub '${GameAwardsTable.Arn}/index/*'
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt WorldPointsQueue.Arn
      Events:
        GetGame:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /game
            Method: get
        PostAward:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /game/award
            Method: post
        GetAwards:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /game/awards
            Method: get

  # Reads project the pace forward between ticks, so this cadence affects only
  # how fast a sacrifice shows up.
  TickFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: tick.lambda_handler
      CodeUri: lambda/
      Timeout: 30
      Environment:
        Variables:
          GAME_STATE_TABLE: !Ref GameStateTable
          GAME_AWARDS_TABLE: !Ref GameAwardsTable
          WORLD_POINTS_QUEUE_URL: !Ref WorldPointsQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt GameStateTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt GameAwardsTable.Arn
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt WorldPointsQueue.Arn
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Description: Subtracts world health and applies queued sacrifices.
            # Left enabled — the function no-ops unless a game is running.
            Enabled: true

Outputs:
  ApiBaseUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod'
  ParticipantsTable:
    Value: !Ref ParticipantsTable
  TeamMessagesTable:
    Value: !Ref TeamMessagesTable
  GameStateTable:
    Value: !Ref GameStateTable
  GameAwardsTable:
    Value: !Ref GameAwardsTable
  WorldPointsQueueUrl:
    Value: !Ref WorldPointsQueue
