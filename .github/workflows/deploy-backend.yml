name: Deploy Backend (SAM)

# Deploys the DynamoDB and Lambda API.

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to request the OIDC JWT for AWS
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AWS SAM CLI
        run: pip install aws-sam-cli

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: SAM build
        working-directory: infra
        run: sam build

      - name: SAM deploy
        working-directory: infra
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
        run: |
          if [ -z "$TWILIO_ACCOUNT_SID" ] || [ -z "$TWILIO_AUTH_TOKEN" ] || [ -z "$TWILIO_VERIFY_SERVICE_SID" ]; then
            echo "::error::Twilio secrets are missing; SMS 2FA would deploy disabled."
            exit 1
          fi
          sam deploy \
            --stack-name bcn2026-backend \
            --s3-bucket "${{ vars.SAM_ARTIFACT_BUCKET }}" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "TwilioAccountSid=$TWILIO_ACCOUNT_SID" \
              "TwilioAuthToken=$TWILIO_AUTH_TOKEN" \
              "TwilioVerifyServiceSid=$TWILIO_VERIFY_SERVICE_SID"

      - name: Show outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name bcn2026-backend \
            --query "Stacks[0].Outputs" --output table
